<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa interactivo · Perú → Lima → Distritos · Museos</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --bg: #0f1722;
      --panel: #16212e;
      --panel-2: #1d2c3d;
      --accent: #e23b3b;
      --accent-2: #f2a900;
      --text: #e8eef5;
      --muted: #93a4b6;
      --border: #26384c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #sidebar {
      width: 340px;
      min-width: 340px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #sidebar header { padding: 18px 18px 14px; border-bottom: 1px solid var(--border); }
    #sidebar header h1 { margin: 0; font-size: 18px; letter-spacing: 0.3px; }
    #sidebar header p { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }

    .backbtn {
      margin: 12px 18px 0;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      display: none;
    }
    .backbtn:hover { border-color: var(--accent-2); }

    .hint {
      margin: 14px 18px;
      padding: 14px;
      border-radius: 10px;
      background: var(--panel-2);
      border: 1px dashed var(--border);
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .hint b { color: var(--text); }

    .controls {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .controls input[type="search"] {
      width: 100%;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .controls input[type="search"]:focus { border-color: var(--accent-2); }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .count { font-size: 12px; color: var(--muted); padding: 8px 18px 0; display: none; }
    #list { flex: 1; overflow-y: auto; padding: 8px 10px 18px; }
    .card {
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .card:hover { background: var(--panel-2); }
    .card.selected { background: var(--panel-2); border-color: var(--accent-2); }
    .card h3 { margin: 0 0 3px; font-size: 14.5px; display: flex; align-items: center; gap: 7px; }
    .card .tag {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 2px 7px;
      border-radius: 5px;
      color: #1a1200;
      font-weight: 600;
    }
    .card p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
    footer {
      padding: 10px 18px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent-2); text-decoration: none; }

    #map { flex: 1; height: 100%; background: #0b1118; }

    /* Quita el recuadro de foco al seleccionar una figura */
    .leaflet-interactive:focus,
    .leaflet-container path:focus,
    path.leaflet-interactive:focus { outline: none !important; }

    .district-tip {
      background: rgba(15,23,34,.92);
      color: #fff;
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
    }
    .district-tip::before { display: none; }

    .leaflet-popup-content { font-size: 13px; line-height: 1.45; }
    .leaflet-popup-content h3 { margin: 0 0 4px; font-size: 15px; }
    .leaflet-popup-content .pin-tag {
      display: inline-block;
      font-size: 10.5px;
      text-transform: uppercase;
      color: #fff;
      padding: 1px 7px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .leaflet-popup-content a { color: #c0392b; }

    .toast {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,23,34,.94);
      color: #fff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      border: 1px solid var(--border);
      z-index: 1000;
      opacity: 0;
      transition: opacity .25s;
      pointer-events: none;
      max-width: 80%;
      text-align: center;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 760px) {
      body { flex-direction: column; }
      #sidebar { width: 100%; min-width: 0; height: 45%; }
      #map { height: 55%; }
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1 id="title">🇵🇪 Perú</h1>
      <p id="subtitle">Haz clic sobre la figura de Lima en el mapa</p>
    </header>
    <button class="backbtn" id="back">← Volver</button>
    <div class="hint" id="hint">
      Vista general del <b>Perú</b> con los departamentos dibujados.<br><br>
      👉 Haz clic sobre la <b>figura de Lima</b> (resaltada) para ver sus <b>distritos</b>.
    </div>
    <div class="controls" id="controls">
      <input id="search" type="search" placeholder="Buscar museo..." autocomplete="off" />
      <div class="filters" id="filters"></div>
    </div>
    <div class="count" id="count"></div>
    <div id="list"></div>
    <footer>
      Límites: <a href="https://github.com/juaneladio/peru-geojson" target="_blank" rel="noopener">peru-geojson</a> · Mapa © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OSM</a>/<a href="https://carto.com/" target="_blank" rel="noopener">CARTO</a>
    </footer>
  </aside>
  <div id="map"></div>
  <div class="toast" id="toast"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    /* ---------- Datos ---------- */
    const PERU_VIEW = { center: [-9.8, -75.3], zoom: 5 };

    // Fuente de límites geográficos (GeoJSON) — se cargan en el navegador.
    const GEO_DEP  = "https://raw.githubusercontent.com/juaneladio/peru-geojson/master/peru_departamental_simple.geojson";
    const GEO_DIST = "https://raw.githubusercontent.com/juaneladio/peru-geojson/master/peru_distrital_simple.geojson";

    // Museos. 'nombdist' = nombre del distrito tal como aparece en el GeoJSON (NOMBDIST).
    const MUSEOS = [
      { nombre: "Museo de Arte de Lima (MALI)", distrito: "Cercado de Lima", nombdist: "LIMA", cat: "Arte", coords: [-12.0628, -77.0353], desc: "Principal museo de arte del país, con 3000 años de historia peruana en el Parque de la Exposición." },
      { nombre: "Museo Nacional de Arqueología, Antropología e Historia", distrito: "Pueblo Libre", nombdist: "PUEBLO LIBRE", cat: "Historia", coords: [-12.0723, -77.0639], desc: "El museo estatal más antiguo del Perú (1822). Estela de Raimondi." },
      { nombre: "Museo Larco", distrito: "Pueblo Libre", nombdist: "PUEBLO LIBRE", cat: "Arqueología", coords: [-12.0716, -77.0703], desc: "Casona virreinal con cerámica precolombina y arte erótico mochica." },
      { nombre: "Museo de la Nación", distrito: "San Borja", nombdist: "SAN BORJA", cat: "Historia", coords: [-12.0905, -76.9947], desc: "Muestras sobre culturas peruanas y el Lugar de la Memoria." },
      { nombre: "Museo de Sitio Pachacamac", distrito: "Lurín", nombdist: "LURIN", cat: "Arqueología", coords: [-12.2266, -76.8987], desc: "Santuario arqueológico prehispánico al sur de Lima." },
      { nombre: "Museo Pedro de Osma", distrito: "Barranco", nombdist: "BARRANCO", cat: "Arte", coords: [-12.1556, -77.0214], desc: "Arte virreinal de la escuela cusqueña en una mansión de Barranco." },
      { nombre: "MATE - Museo Mario Testino", distrito: "Barranco", nombdist: "BARRANCO", cat: "Arte", coords: [-12.1471, -77.0211], desc: "Fotografía contemporánea y la serie 'Alta Moda'." },
      { nombre: "Museo Andrés del Castillo", distrito: "Cercado de Lima", nombdist: "LIMA", cat: "Arqueología", coords: [-12.0476, -77.0331], desc: "Minerales, cerámica Nasca y Chancay en una casona republicana." },
      { nombre: "Museo Metropolitano de Lima", distrito: "Cercado de Lima", nombdist: "LIMA", cat: "Historia", coords: [-12.0686, -77.0339], desc: "Recorrido audiovisual e inmersivo por la historia de Lima." },
      { nombre: "Museo de Oro del Perú", distrito: "Surco", nombdist: "SANTIAGO DE SURCO", cat: "Historia", coords: [-12.1063, -76.9777], desc: "Oro precolombino y una extensa colección de armas." },
      { nombre: "Casa Museo José Carlos Mariátegui", distrito: "Cercado de Lima", nombdist: "LIMA", cat: "Historia", coords: [-12.0561, -77.0334], desc: "Casa del pensador peruano, hoy centro cultural." },
      { nombre: "Museo de Sitio Huaca Pucllana", distrito: "Miraflores", nombdist: "MIRAFLORES", cat: "Arqueología", coords: [-12.1110, -77.0344], desc: "Pirámide de adobe de la cultura Lima en Miraflores." },
      { nombre: "Museo de Historia Natural (UNMSM)", distrito: "Jesús María", nombdist: "JESUS MARIA", cat: "Ciencia", coords: [-12.0599, -77.0470], desc: "Biodiversidad peruana de la Universidad de San Marcos." },
      { nombre: "Centro Cultural / Museo de SJM", distrito: "San Juan de Miraflores (SJM)", nombdist: "SAN JUAN DE MIRAFLORES", cat: "Comunitario", coords: [-12.1581, -76.9711], desc: "Espacio cultural comunitario en San Juan de Miraflores, sur de Lima." },
      { nombre: "Museo de Sitio Pampa de Cuevas / Lurín-Sur", distrito: "San Juan de Miraflores (SJM)", nombdist: "SAN JUAN DE MIRAFLORES", cat: "Arqueología", coords: [-12.1665, -76.9603], desc: "Vestigios arqueológicos del cono sur cercanos a SJM." }
    ];

    const CAT_COLORS = {
      "Arte": "#e23b3b", "Arqueología": "#f2a900", "Historia": "#3b82e2",
      "Ciencia": "#2ecc71", "Comunitario": "#9b59b6"
    };

    /* ---------- Utilidades ---------- */
    function prop(p, keys) {
      for (const k of keys) if (p && p[k] != null && p[k] !== "") return p[k];
      return "";
    }
    const DEP_KEYS  = ["NOMBDEP", "FIRST_NOMB", "departamento", "NAME_1", "name"];
    const DIST_KEYS = ["NOMBDIST", "distrito", "NAME_3", "name"];
    const PROV_KEYS = ["NOMBPROV", "provincia", "NAME_2"];
    const norm = s => String(s).trim().toUpperCase();

    /* ---------- Mapa (estilo limpio, sin detalles) ---------- */
    const map = L.map("map", { zoomControl: true, minZoom: 4 })
      .setView(PERU_VIEW.center, PERU_VIEW.zoom);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 19, subdomains: "abcd", attribution: '© OpenStreetMap · © CARTO'
    }).addTo(map);

    const depLayer    = L.layerGroup().addTo(map);  // departamentos (vista Perú)
    const distLayer   = L.layerGroup();             // distritos de Lima
    const museosLayer = L.layerGroup();             // marcadores de museos

    /* ---------- Marcadores de museos ---------- */
    function makeIcon(color) {
      return L.divIcon({
        className: "",
        html: `<div style="background:${color};width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>`,
        iconSize: [22, 22], iconAnchor: [11, 22], popupAnchor: [0, -20]
      });
    }
    const markers = [];
    MUSEOS.forEach((m, i) => {
      const color = CAT_COLORS[m.cat] || "#e23b3b";
      const marker = L.marker(m.coords, { icon: makeIcon(color) });
      marker.bindPopup(`
        <span class="pin-tag" style="background:${color}">${m.cat}</span>
        <h3>${m.nombre}</h3>
        <p style="margin:0 0 6px;color:#555">${m.distrito}</p>
        <p style="margin:0">${m.desc}</p>
        <p style="margin:6px 0 0"><a href="https://www.google.com/maps/search/?api=1&query=${m.coords[0]},${m.coords[1]}" target="_blank" rel="noopener">Cómo llegar →</a></p>
      `);
      markers.push({ data: m, marker, index: i });
    });

    /* ---------- Carga de límites geográficos ---------- */
    let limaDepFeature = null;
    let limaBounds = null;
    let distGeoReady = false;

    // Departamentos: dibuja todos, resalta Lima; clic en la figura de Lima -> distritos.
    fetch(GEO_DEP)
      .then(r => r.json())
      .then(gj => {
        L.geoJSON(gj, {
          style: f => {
            const isLima = norm(prop(f.properties, DEP_KEYS)) === "LIMA";
            return isLima
              ? { color: "#b07d00", weight: 2, fillColor: "#f2a900", fillOpacity: 0.65 }
              : { color: "#8aa0b5", weight: 1, fillColor: "#c3cedb", fillOpacity: 0.35 };
          },
          onEachFeature: (f, layer) => {
            const name = prop(f.properties, DEP_KEYS);
            const isLima = norm(name) === "LIMA";
            layer.bindTooltip(name, { sticky: true, className: "district-tip" });
            if (isLima) limaDepFeature = layer;
            layer.on("click", (e) => {
              L.DomEvent.stopPropagation(e);
              if (isLima) enterLima();
              else { map.flyToBounds(layer.getBounds(), { duration: 0.8 }); showToast(`${name}: aún sin museos cargados.`); }
            });
            layer.on("mouseover", () => layer.setStyle({ weight: 2.5 }));
            layer.on("mouseout",  () => layer.setStyle({ weight: isLima ? 2 : 1 }));
          }
        }).addTo(depLayer);
      })
      .catch(() => showToast("No se pudieron cargar los límites del Perú (revisa tu conexión)."));

    // Distritos de Lima (provincia Lima) + Callao opcional.
    fetch(GEO_DIST)
      .then(r => r.json())
      .then(gj => {
        const feats = gj.features.filter(f => norm(prop(f.properties, PROV_KEYS)) === "LIMA");
        const fc = { type: "FeatureCollection", features: feats };
        const gl = L.geoJSON(fc, {
          style: { color: "#e23b3b", weight: 1, fillColor: "#e23b3b", fillOpacity: 0.12 },
          onEachFeature: (f, layer) => {
            const dname = prop(f.properties, DIST_KEYS);
            const n = MUSEOS.filter(m => norm(m.nombdist) === norm(dname)).length;
            layer.bindTooltip(`${dname}${n ? ` · ${n} museo${n > 1 ? "s" : ""}` : ""}`,
              { sticky: true, className: "district-tip" });
            layer.on("mouseover", () => layer.setStyle({ fillOpacity: 0.38, weight: 2 }));
            layer.on("mouseout",  () => layer.setStyle({ fillOpacity: (norm(dname) === selectedDistrict ? 0.45 : 0.12), weight: 1 }));
            layer.on("click", (e) => {
              L.DomEvent.stopPropagation(e);
              selectDistrict(norm(dname), dname, layer);
            });
            f._layerRef = layer;
          }
        });
        gl.addTo(distLayer);
        limaDistGeo = gl;
        limaBounds = gl.getBounds();
        distGeoReady = true;
        if (inLima) map.flyToBounds(limaBounds, { duration: 0.9 });
      })
      .catch(() => showToast("No se pudieron cargar los distritos de Lima."));

    let limaDistGeo = null;

    /* ---------- Navegación ---------- */
    const titleEl = document.getElementById("title");
    const subtitleEl = document.getElementById("subtitle");
    const hintEl = document.getElementById("hint");
    const controlsEl = document.getElementById("controls");
    const countEl = document.getElementById("count");
    const backEl = document.getElementById("back");
    const listEl = document.getElementById("list");
    let inLima = false;
    let selectedDistrict = "";   // NOMBDIST en mayúsculas, "" = todos

    const HINT_LIMA = "Estás en <b>Lima</b>. Haz clic en la <b>figura de un distrito</b> (p. ej. <b>SJM</b>) para ver sus museos.";

    function enterLima() {
      if (inLima) return;
      inLima = true;
      map.removeLayer(depLayer);
      distLayer.addTo(map);
      if (distGeoReady && limaBounds) map.flyToBounds(limaBounds, { duration: 0.9 });
      else map.flyTo([-12.05, -77.02], 11, { duration: 0.9 });
      titleEl.textContent = "🏛️ Lima · distritos";
      subtitleEl.textContent = "Haz clic en la figura de un distrito (p. ej. SJM)";
      hintEl.innerHTML = HINT_LIMA;
      hintEl.style.display = "block";
      controlsEl.style.display = "none";
      countEl.style.display = "none";
      backEl.style.display = "block";
      listEl.innerHTML = "";
    }

    function enterPeru() {
      inLima = false;
      selectedDistrict = "";
      map.removeLayer(distLayer);
      map.removeLayer(museosLayer);
      depLayer.addTo(map);
      map.flyTo(PERU_VIEW.center, PERU_VIEW.zoom, { duration: 0.9 });
      titleEl.textContent = "🇵🇪 Perú";
      subtitleEl.textContent = "Haz clic sobre la figura de Lima en el mapa";
      hintEl.style.display = "block";
      controlsEl.style.display = "none";
      countEl.style.display = "none";
      backEl.style.display = "none";
      listEl.innerHTML = "";
    }

    function selectDistrict(key, label, layer) {
      // toggle: si vuelves a clicar el mismo distrito, se deselecciona
      selectedDistrict = (selectedDistrict === key) ? "" : key;
      if (limaDistGeo) limaDistGeo.setStyle(f => ({
        color: "#e23b3b", weight: 1, fillColor: "#e23b3b",
        fillOpacity: norm(prop(f.properties, DIST_KEYS)) === selectedDistrict ? 0.45 : 0.12
      }));
      if (selectedDistrict) {
        // Última capa: recién aquí se muestran los museos y sus detalles.
        museosLayer.addTo(map);
        if (layer) map.flyToBounds(layer.getBounds(), { duration: 0.8, maxZoom: 14 });
        subtitleEl.textContent = `Distrito: ${label}`;
        hintEl.style.display = "none";
        controlsEl.style.display = "flex";
        countEl.style.display = "block";
        render();
      } else {
        // Volver a la capa de distritos: se ocultan museos y detalles.
        map.removeLayer(museosLayer);
        if (limaBounds) map.flyToBounds(limaBounds, { duration: 0.8 });
        subtitleEl.textContent = "Haz clic en la figura de un distrito (p. ej. SJM)";
        hintEl.innerHTML = HINT_LIMA;
        hintEl.style.display = "block";
        controlsEl.style.display = "none";
        countEl.style.display = "none";
        listEl.innerHTML = "";
      }
    }

    backEl.addEventListener("click", () => { if (selectedDistrict) selectDistrict(selectedDistrict, "", null); else enterPeru(); });

    /* ---------- Lista + filtros ---------- */
    const cats = [...new Set(MUSEOS.map(m => m.cat))];
    let activeCat = "Todos";
    const filtersEl = document.getElementById("filters");
    ["Todos", ...cats].forEach(c => {
      const b = document.createElement("button");
      b.className = "chip" + (c === "Todos" ? " active" : "");
      b.textContent = c;
      b.onclick = () => {
        activeCat = c;
        document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        render();
      };
      filtersEl.appendChild(b);
    });

    const searchEl = document.getElementById("search");
    let selectedIndex = null;

    function visible(m) {
      const q = searchEl.value.trim().toLowerCase();
      const matchCat = activeCat === "Todos" || m.cat === activeCat;
      const matchDist = !selectedDistrict || norm(m.nombdist) === selectedDistrict;
      const matchQ = !q ||
        m.nombre.toLowerCase().includes(q) ||
        m.distrito.toLowerCase().includes(q) ||
        m.desc.toLowerCase().includes(q);
      return matchCat && matchDist && matchQ;
    }

    function render() {
      if (!inLima || !selectedDistrict) return;
      listEl.innerHTML = "";
      let shown = 0;
      markers.forEach(({ data, marker, index }) => {
        if (visible(data)) {
          marker.addTo(museosLayer);
          shown++;
          const card = document.createElement("div");
          card.className = "card" + (selectedIndex === index ? " selected" : "");
          card.innerHTML = `
            <h3><span class="tag" style="background:${CAT_COLORS[data.cat]}">${data.cat}</span>${data.nombre}</h3>
            <p>${data.distrito} — ${data.desc}</p>`;
          card.onclick = () => {
            selectedIndex = index;
            map.flyTo(data.coords, 15, { duration: 0.8 });
            marker.openPopup();
            render();
          };
          listEl.appendChild(card);
        } else {
          museosLayer.removeLayer(marker);
        }
      });
      const ctx = selectedDistrict ? ` en este distrito` : "";
      countEl.textContent = `${shown} museo${shown === 1 ? "" : "s"}${ctx}`;
    }
    searchEl.addEventListener("input", render);

    /* ---------- Toast ---------- */
    let toastTimer;
    const toastEl = document.getElementById("toast");
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2800);
    }
  </script>
</body>
</html>
